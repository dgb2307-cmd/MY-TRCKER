<style>

  .qbar input{height:48px;flex:1;min-width:0}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fade .15s}
  .modal{width:100%;max-width:440px;max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:env(safe-area-inset-bottom)}

  #toast.show{transform:translateX(-50%) translateY(0)}
  .done-text{text-decoration:line-through;color:var(--muted)}
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  ::-webkit-scrollbar{display:none}
  .trow{display:flex;align-items:center;min-height:58px;margin-bottom:8px}
  .ctl{width:80px;height:66px;flex-direction:column;gap:3px;font-size:11px;padding:0;border-radius:18px}

  #dial{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

<script>
'use strict';
/* ============================ UTILIDADES ============================ */
const KEY = 'foco_pwa_v1';
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => fmt(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mondayOf = s => { const d = parse(s); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return fmt(d); };
const DAYS = [{ l: 'Lun', v: 1 }, { l: 'Mar', v: 2 }, { l: 'Mié', v: 3 }, { l: 'Jue', v: 4 }, { l: 'Vie', v: 5 }, { l: 'Sáb', v: 6 }, { l: 'Dom', v: 0 }];
const longDate = s => cap(parse(s).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }));
const shortDate = s => cap(parse(s).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, ''));
const hhmm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const REP_LABEL = { none: '', daily: 'Diaria', weekly: 'Semanal' };

/* ============================ LOGO / ICONO (SVG) ============================ */
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#FFFFFF"/><circle cx="32" cy="35" r="18" fill="none" stroke="#FF6B00" stroke-width="5"/><path d="M32 24v11l7 5" fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 8h12" fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round"/></svg>`;
const ICON_URI = 'data:image/svg+xml,' + encodeURIComponent(LOGO_SVG);
$('#logo').innerHTML = LOGO_SVG;

/* ============================ ESTADO ============================ */
const defaults = () => ({
  events: [], notes: {}, subjects: [],
  settings: { work: 25, rest: 5, theme: 'dark' },
  pomo: { phase: 'work', remaining: 25 * 60, running: false, endAt: null, sessions: 0 },
  ui: { tab: 'home', sub: 'list', mode: 'day', open: [] }
});
const clampMin = v => Math.min(60, Math.max(1, Math.round(Number(v)) || 25));
function normalize(o) {
  o = o || {};
  const s = Object.assign(defaults(), o);
  s.settings = Object.assign(defaults().settings, o.settings);
  if (!['dark', 'light'].includes(s.settings.theme)) s.settings.theme = 'dark';
  s.settings.work = clampMin(s.settings.work); s.settings.rest = clampMin(s.settings.rest);
  s.pomo = Object.assign(defaults().pomo, o.pomo);
  if (!['work', 'rest'].includes(s.pomo.phase)) s.pomo.phase = 'work';
  s.ui = Object.assign(defaults().ui, o.ui);
  if (!Array.isArray(s.ui.open)) s.ui.open = [];
  s.ui.open = s.ui.open.slice(0, 1);
  if (!['day', 'week', 'month'].includes(s.ui.mode)) s.ui.mode = 'day';
  if (!['home', 'study', 'settings'].includes(s.ui.tab)) s.ui.tab = 'home';
  if (!['list', 'pomo'].includes(s.ui.sub)) s.ui.sub = 'list';
  if (!Array.isArray(s.subjects)) s.subjects = [];
  let ev = Array.isArray(o.events) ? o.events : [];
  if (!Array.isArray(o.events) && o.tasks && typeof o.tasks === 'object') {
    Object.keys(o.tasks).forEach(ds => (o.tasks[ds] || []).forEach(t => ev.push({ id: t.id, text: t.text, date: ds, doneOn: t.done ? { [ds]: true } : {} })));
  }
  delete s.tasks;
  s.events = ev.filter(e => e && e.text && e.date).map(e => ({
    id: e.id || uid(), text: String(e.text), date: e.date,
    time: /^\d\d:\d\d$/.test(e.time || '') ? e.time : '',
    dur: Number(e.dur) || 60,
    repeat: ['daily', 'weekly'].includes(e.repeat) ? e.repeat : 'none',
    skip: Array.isArray(e.skip) ? e.skip : [],
    doneOn: e.doneOn && typeof e.doneOn === 'object' ? e.doneOn : {}
  }));
  const notes = {};
  if (o.notes && typeof o.notes === 'object') Object.keys(o.notes).forEach(ds => {
    const v = o.notes[ds];
    if (typeof v === 'string') { if (v.trim()) notes[ds] = [{ id: uid(), text: v }]; }
    else if (Array.isArray(v)) { const a = v.filter(n => n && n.text).map(n => ({ id: n.id || uid(), text: String(n.text) })); if (a.length) notes[ds] = a; }
  });
  s.notes = notes;
  return s;
}
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : defaults(); }
  catch (e) { return defaults(); }
}
let S = load();
let sel = todayStr();
let quickText = '';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar (almacenamiento lleno)'); } };
function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme;
  const m = $('#theme-meta'); if (m) m.content = S.settings.theme === 'light' ? '#ffffff' : '#000000';
}

/* ============================ TAREAS (modelo) ============================ */
const newEv = o => Object.assign({ id: uid(), text: '', date: todayStr(), time: '', dur: 60, repeat: 'none', skip: [], doneOn: {} }, o);
function occurs(e, ds) {
  if (ds < e.date || (e.skip || []).includes(ds)) return false;
  if (e.repeat === 'daily') return true;
  if (e.repeat === 'weekly') return parse(ds).getDay() === parse(e.date).getDay();
  return ds === e.date;
}
const evOn = ds => S.events.filter(e => occurs(e, ds)).sort((a, b) => {
  if (!!a.time !== !!b.time) return a.time ? -1 : 1;
  if (a.time) return a.time.localeCompare(b.time) || a.text.localeCompare(b.text);
  return a.text.localeCompare(b.text);
});
const isDone = (e, ds) => !!(e.doneOn && e.doneOn[ds]);
const startMin = e => { const [h, m] = e.time.split(':').map(Number); return h * 60 + m; };

/* ============================ ICONOS ============================ */

  cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  chk: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

/* ============================ VOZ: RECONOCIMIENTO (Web Speech API) ============================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, micKey = null;
function applyMic() {
  document.querySelectorAll('[data-mic]').forEach(b => b.classList.toggle('rec', listening && b.dataset.mic === micKey));
}
function stopVoice() { if (rec && listening) { try { rec.stop(); } catch (e) { } } }
function abortVoice(prefix) {
  if (rec && listening && micKey && micKey.startsWith(prefix)) { rec._cancel = true; try { rec.abort(); } catch (e) { } }
}
function startVoice(key, cb, live) {
  if (!SR) { toast('Tu navegador no admite dictado por voz. Prueba con Chrome, Edge o Safari.'); return; }
  if (listening) { if (micKey === key) stopVoice(); return; }
  const r = new SR(); rec = r;
  r.lang = 'es-ES'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  let txt = '';
  r.onstart = () => { listening = true; micKey = key; applyMic(); };
  r.onresult = ev => { txt = Array.from(ev.results).map(x => x[0].transcript).join(' ').trim(); if (live) live(txt); };
  r.onerror = ev => {
    if (ev.error === 'aborted') return;
    const m = {
      'not-allowed': 'Permiso de micrófono denegado',
      'service-not-allowed': 'El dictado no está permitido en este navegador o contexto',
      'no-speech': 'No se detectó voz, inténtalo de nuevo',
      'audio-capture': 'No se encontró ningún micrófono',
      'network': 'El dictado necesita conexión a internet'
    };
    toast(m[ev.error] || 'Error de dictado: ' + ev.error);
  };
  r.onend = () => { listening = false; micKey = null; applyMic(); if (txt && !r._cancel) cb(txt); };
  try { r.start(); } catch (e) { toast('No se pudo iniciar el dictado'); }
}

/* ============================ VOZ: INTERPRETACIÓN DE FECHA Y HORA (local) ============================ */
const NW = { una: 1, un: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12 };
const numv = x => { x = String(x).toLowerCase(); return /^\d+$/.test(x) ? parseInt(x, 10) : NW[x]; };
const WD = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6 };
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const LA = '(?=[\\s.,;:!?]|$)';
function parseVoice(text) {
  let s = ' ' + String(text).replace(/\s+/g, ' ').trim() + ' ';
  let date = null, time = null;
  const today = todayStr();
  const cut = m => { s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length); };

  /* 1) HORA: "a las 15:00", "a las 3", "a las 4 de la tarde", "a las tres y media"… */
  const NUM = '(\\d{1,2}|una|un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)';
  const reT = new RegExp('\\s(?:a|sobre|hacia|para|desde)\\s+la[s]?\\s+' + NUM +
    '(?:\\s*[:.h]\\s*(\\d{2}))?(?:\\s+y\\s+(media|cuarto|\\d{1,2}))?(?:\\s+menos\\s+(cuarto|\\d{1,2}))?' +
    '(?:\\s*(?:horas|hs|h))?(?:\\s+(?:de|por|en)\\s+la\\s+(ma[ñn]ana|tarde|noche|madrugada))?' + LA, 'i');
  let m = s.match(reT);
  if (m) {
    const raw = numv(m[1]);
    let h = raw, mi = 0;
    if (m[2]) mi = parseInt(m[2], 10);
    if (m[3]) mi = m[3] === 'media' ? 30 : m[3] === 'cuarto' ? 15 : parseInt(m[3], 10);
    const per = m[5] ? m[5].toLowerCase() : '';
    if (per === 'tarde') { if (h < 12) h += 12; }
    else if (per === 'noche') { if (raw === 12) h = 0; else if (h < 12) h += 12; }
    else if (per) { if (h === 12) h = 0; }
    else if (h >= 1 && h <= 7) h += 12;
    if (m[4]) { h -= 1; mi = m[4] === 'cuarto' ? 45 : 60 - parseInt(m[4], 10); }
    if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) { time = pad(h) + ':' + pad(mi); cut(m); }
  }
  if (!time) {
    m = s.match(new RegExp('\\s(?:al\\s+)?mediod[ií]a' + LA, 'i'));
    if (m) { time = '12:00'; cut(m); }
  }

  /* 2) Franjas sueltas ("por la tarde") y expresiones "esta tarde" */
  s = s.replace(new RegExp('\\s(?:por|de|en)\\s+la\\s+(?:ma[ñn]ana|tarde|noche|madrugada)' + LA, 'gi'), ' ');
  m = s.match(new RegExp('\\sesta\\s+(?:tarde|noche|ma[ñn]ana)' + LA, 'i'));
  if (m) { date = today; cut(m); }

  /* 3) DÍA */
  if (!date) {
    m = s.match(new RegExp('\\s(?:para\\s+)?pasado\\s+ma[ñn]ana' + LA, 'i'));
    if (m) { date = addDays(today, 2); cut(m); }
  }
  if (!date) {
    m = s.match(new RegExp('\\s(?:para\\s+)?ma[ñn]ana' + LA, 'i'));
    if (m) { date = addDays(today, 1); cut(m); }
  }
  if (!date) {
    m = s.match(new RegExp('\\s(?:para\\s+)?hoy' + LA, 'i'));
    if (m) { date = today; cut(m); }
  }
  if (!date) {
    m = s.match(new RegExp('\\s(?:para\\s+)?(?:el\\s+)?(\\d{1,2})\\s+de\\s+(' + MONTHS.join('|') + ')(?:\\s+de\\s+(\\d{4}))?' + LA, 'i'));
    if (m) {
      const dd = parseInt(m[1], 10), mm = MONTHS.indexOf(m[2].toLowerCase());
      const now = new Date(); let yy = m[3] ? parseInt(m[3], 10) : now.getFullYear();
      let d = new Date(yy, mm, dd);
      if (!m[3] && fmt(d) < today) d = new Date(yy + 1, mm, dd);
      if (d.getMonth() === mm && dd >= 1) { date = fmt(d); cut(m); }
    }
  }
  if (!date) {
    m = s.match(new RegExp('\\s(?:para\\s+)?(?:(?:el|este)\\s+)?(?:pr[oó]ximo\\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)' + LA, 'i'));
    if (m) {
      const key = m[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const diff = (WD[key] - parse(today).getDay() + 7) % 7 || 7;
      date = addDays(today, diff); cut(m);
    }
  }

  /* 4) TÍTULO: quitar verbos de orden y restos */
  s = s.replace(/\s+/g, ' ').trim();
  s = s.replace(/^(?:por favor\s+)?(?:a[ñn]ad(?:e|ir|eme)|agrega(?:r|me)?|crea(?:r)?|apunta(?:r)?|anota(?:r)?|pon(?:me|er)?|programa(?:r)?|recu[eé]rdame|recordar(?:me)?|nueva\s+tarea|tarea)(?=\s|$)\s*/i, '');
  s = s.replace(/^(?:(?:una|la)\s+tarea\s+|tarea\s+)?(?:de\s+|que\s+|para\s+)?/i, '');
  s = s.replace(/(?:\s+(?:el|a|de|para|en|y|por))+$/i, '').replace(/[\s,;:.]+$/, '').replace(/^[\s,;:.]+/, '').trim();
  return { title: s ? cap(s) : '', date, time };
}

/* ============================ VISTA: INICIO ============================ */
function headerLabel() {

  if (S.ui.mode === 'day') return longDate(sel);
  if (S.ui.mode === 'week') {
    const a = parse(mondayOf(sel)), b = parse(addDays(mondayOf(sel), 6));
    const f = x => x.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', '');
    return `${f(a)} – ${f(b)}`;
  }
  return cap(d.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }));
}
const calHead = () => `<div class="flex items-center gap-1 mb-1">
  <button class="iconbtn" data-a="prev">${ic.left}</button>
  <div class="flex-1 text-center font-semibold text-[14px] truncate">${esc(headerLabel())}</div>
  <span class="chip" data-a="goToday">Hoy</span>
  <button class="iconbtn" data-a="next">${ic.right}</button></div>`;
const dotsHTML = ds => { const n = Math.min(3, evOn(ds).length); return n ? `<span class="dots">${'<i></i>'.repeat(n)}</span>` : ''; };
function calDay() {
  const td = todayStr(), w = mondayOf(sel);
  let c = '';
  for (let i = 0; i < 7; i++) {
    const ds = addDays(w, i), d = parse(ds);
    c += `<div class="daycell ${ds === sel ? 'sel' : ''} ${ds === td ? 'today' : ''}" style="height:50px" data-a="sel" data-v="${ds}">
      <span style="font-size:9.5px;opacity:.7;font-weight:600">${DAYS.find(x => x.v === d.getDay()).l.toUpperCase()}</span>${d.getDate()}${dotsHTML(ds)}</div>`;
  }

}
function calWeek() {
  const td = todayStr(), w = mondayOf(sel);
  let c = '';
  for (let i = 0; i < 7; i++) {
    const ds = addDays(w, i), d = parse(ds), list = evOn(ds);
    c += `<div class="wcell ${ds === sel ? 'sel' : ''} ${ds === td ? 'today' : ''}" data-a="sel" data-v="${ds}">
      <div class="label" style="font-size:9px">${DAYS.find(x => x.v === d.getDay()).l}</div><div class="wn">${d.getDate()}</div>

  }
  return `<div class="card p-2 flex-none">${calHead()}<div class="grid grid-cols-7 gap-1">${c}</div></div>`;
}
function calMonth() {
  const td = todayStr(), d = parse(sel), y = d.getFullYear(), m = d.getMonth();
  const off = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  let c = '';
  for (let i = 0; i < off; i++) c += '<div></div>';
  for (let n = 1; n <= dim; n++) {

/* ============================ POMODORO (dial giratorio) ============================ */
const CIRC = 2 * Math.PI * 100;
const mmss = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
function viewPomo() {
  const P = S.pomo, work = P.phase === 'work', col = work ? 'var(--accent)' : 'var(--green)';
  return `<div class="flex items-center justify-between mb-2 flex-none"><button class="btn" data-a="backStudy">${ic.left} Volver a Estudio</button><div class="muted text-xs">Sesiones: <b style="color:var(--text)">${P.sessions}</b></div></div>
    <div class="seg mb-1"><button class="${work ? 'on' : ''}" data-a="phase" data-v="work">Trabajo</button><button class="${!work ? 'on' : ''}" data-a="phase" data-v="rest">Descanso</button></div>
    <div class="flex-1 min-h-0 flex flex-col items-center justify-center">
      <div style="width:min(78vw,42dvh,300px);aspect-ratio:1;position:relative">
        <svg id="dial" viewBox="0 0 220 220" style="width:100%;height:100%;display:block">
          <circle cx="110" cy="110" r="100" fill="none" stroke="var(--card2)" stroke-width="16"/>
          <g stroke="var(--line)" stroke-width="2">${Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6, x1 = 110 + 83 * Math.sin(a), y1 = 110 - 83 * Math.cos(a), x2 = 110 + 90 * Math.sin(a), y2 = 110 - 90 * Math.cos(a); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }).join('')}</g>
          <circle id="ring" cx="110" cy="110" r="100" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="0 ${CIRC}"/>
          <circle id="knob" cx="110" cy="10" r="13" fill="${col}" stroke="var(--bg)" stroke-width="4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
          <div id="clockTime" style="font-size:clamp(38px,15vw,56px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums">00:00</div>
          <div class="label mt-1" style="color:${col}">${work ? 'Enfoque' : 'Descanso'}</div>
        </div>
      </div>
      <div class="muted text-xs mt-3 text-center px-4" id="dialHint">Arrastra el borde del círculo para ajustar los minutos</div>
    </div>
    <div class="flex gap-3 justify-center flex-none pb-1">
      <button class="btn btn-primary ctl" id="btnPlay" data-a="pomoPlay">${ic.play}<span>Play</span></button>
      <button class="btn ctl" id="btnPause" data-a="pomoPause">${ic.pause}<span>Pause</span></button>
      <button class="btn ctl" data-a="pomoReset">${ic.reset}<span>Reset</span></button>
    </div>`;
}
function updateClock() {
  const rem = Math.max(0, S.pomo.remaining), frac = Math.min(1, rem / 3600);
  const t = $('#clockTime');
  if (t) {
    t.textContent = mmss(rem);
    const ring = $('#ring'); if (ring) ring.setAttribute('stroke-dasharray', `${(CIRC * frac).toFixed(2)} ${CIRC.toFixed(2)}`);
    const k = $('#knob'); if (k) { const a = frac * 2 * Math.PI; k.setAttribute('cx', (110 + 100 * Math.sin(a)).toFixed(2)); k.setAttribute('cy', (110 - 100 * Math.cos(a)).toFixed(2)); }
    const pl = $('#btnPlay'), pa = $('#btnPause');
    if (pl) pl.classList.toggle('off', S.pomo.running);
    if (pa) pa.classList.toggle('off', !S.pomo.running);
    const h = $('#dialHint'); if (h && !dragging) h.textContent = S.pomo.running ? 'En marcha · pausa para ajustar el tiempo' : 'Arrastra el borde del círculo para ajustar los minutos';
  }
  const o = $('#obarTime'); if (o) o.textContent = S.pomo.running ? '· ' + mmss(rem) : '';
}
/* dial: arrastrar sobre el borde para cambiar minutos */
let dragging = false, lastMin = 0;
function dialPoint(e) {
  const svg = $('#dial'), r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 220 - 110, y = (e.clientY - r.top) / r.height * 220 - 110;
  return { x, y, d: Math.hypot(x, y) };
}
function dialMove(e) {
  const p = dialPoint(e);
  let ang = Math.atan2(p.x, -p.y); if (ang < 0) ang += 2 * Math.PI;
  let m = Math.round(ang / (2 * Math.PI) * 60);
  if (m === 0) m = lastMin > 30 ? 60 : 1;
  if (lastMin > 45 && m < 15) m = 60;
  if (lastMin < 15 && m > 45) m = 1;
  m = Math.min(60, Math.max(1, m));
  lastMin = m;
  S.settings[S.pomo.phase] = m; S.pomo.remaining = m * 60;
  updateClock();
  const h = $('#dialHint'); if (h) h.textContent = m + ' min';
}
document.addEventListener('pointerdown', e => {
  const svg = e.target.closest && e.target.closest('#dial'); if (!svg) return;
  if (S.pomo.running) { toast('Pausa el temporizador para ajustar el tiempo'); return; }
  const p = dialPoint(e); if (p.d < 58 || p.d > 122) return;
  dragging = true; lastMin = Math.round(S.pomo.remaining / 60) || 1;
  try { svg.setPointerCapture(e.pointerId); } catch (x) { }
  dialMove(e); e.preventDefault();
});
document.addEventListener('pointermove', e => { if (dragging) { dialMove(e); e.preventDefault(); } });
const dialEnd = () => { if (dragging) { dragging = false; save(); updateClock(); } };
document.addEventListener('pointerup', dialEnd);
document.addEventListener('pointercancel', dialEnd);

let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { }
}
function beep() {
  try {
    unlockAudio(); if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [[880, 0], [1174, 0.25], [1568, 0.5]].forEach(([f, off]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.18, now + off + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.6);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now + off); o.stop(now + off + 0.65);
    });
  } catch (e) { }
}
const inPomo = () => S.ui.tab === 'study' && S.ui.sub === 'pomo';
function finishPhase() {
  const wasWork = S.pomo.phase === 'work';
  if (wasWork) S.pomo.sessions++;
  S.pomo.phase = wasWork ? 'rest' : 'work';
  S.pomo.running = false; S.pomo.endAt = null; S.pomo.remaining = S.settings[S.pomo.phase] * 60;
  save(); beep();
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { }
  toast(wasWork ? '🎉 ¡Tiempo de trabajo completado! Toca descansar.' : '⏰ Descanso terminado. ¡A por otra sesión!');
  if (inPomo()) render(); else updateClock();
  document.title = 'Foco · Hábitos y productividad';
}
function tick() {
  const P = S.pomo;
  if (P.running && P.endAt) {
    const rem = Math.round((P.endAt - Date.now()) / 1000);
    if (rem <= 0) { P.remaining = 0; finishPhase(); return; }
    P.remaining = rem;
  }
  updateClock();
  document.title = P.running ? `${mmss(Math.max(0, P.remaining))} · Foco` : 'Foco · Hábitos y productividad';
}

    }, 'Borrar todo');
  },
  dlsw() { dl(new Blob([SW_CODE], { type: 'text/javascript' }), 'sw.js'); toast('Guarda sw.js junto a index.html'); },
  /* modales */
  mclose() { closeModal(); },
  mbg() { closeModal(); },
  mok() { const cb = window._okCb; closeModal(); if (cb) cb(); }
};
function dl(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a === 'mbg' && e.target !== el) return;
  fn(el.dataset, e, el);
});
document.addEventListener('input', e => { if (e.target.id === 'quickIn') quickText = e.target.value; });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'quick') {
    const v = $('#quickIn').value.trim(); if (!v) { $('#quickIn').focus(); return; }
    S.events.push(newEv({ text: cap(v), date: sel })); quickText = ''; save(); render();
  } else if (kind === 'ev') {
    syncDraft();
    const text = D.text.trim(); if (!text) { const i = $('#fText'); if (i) i.focus(); return; }
    if (D.kind === 'note') {
      const arr = S.notes[D.date] = S.notes[D.date] || [];
      if (D.noteId) { const n = arr.find(x => x.id === D.noteId); if (n) n.text = text; }
      else arr.push({ id: uid(), text });
    } else {
      const data = { text, date: D.date, time: D.time || '', repeat: D.repeat };
      if (D.id) { const ev = S.events.find(x => x.id === D.id); if (ev) { Object.assign(ev, data); if (ev.repeat === 'none') ev.skip = []; } }
      else S.events.push(newEv(data));
      sel = D.date;
    }
    save(); closeModal(); render();
  } else if (kind === 'sadd') {
    const i = $('#sInput'), v = i ? i.value.trim() : ''; if (!v) { if (i) i.focus(); return; }
    const sub = SD.sid && findSubj(SD.sid);
    if (SD.kind === 'topic' && sub) sub.topics.push({ id: uid(), name: v, given: false, notes: false, studied: false });
    else { const s = { id: uid(), name: v, topics: [] }; S.subjects.push(s); S.ui.open = [s.id]; }
    save(); closeModal(); render();
  } else if (kind === 'ask') {
    const v = $('#askInput').value.trim(); if (!v) return;
    const cb = window._askCb; closeModal(); if (cb) cb(v);
  }
});
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result), data = j && j.data ? j.data : j;
      if (!data || typeof data !== 'object' || !('events' in data || 'tasks' in data || 'subjects' in data)) throw new Error('formato');
      confirmBox('Importar datos', 'Se reemplazarán todos los datos actuales por los de la copia de seguridad.', () => {
        S = normalize(data); S.pomo.running = false; S.pomo.endAt = null; S.pomo.remaining = S.settings[S.pomo.phase] * 60;
        save(); render(); toast('Datos importados correctamente');
      }, 'Importar');
    } catch (err) { toast('El archivo no es una copia de seguridad válida'); }
  };
  r.readAsText(f);
});
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { S = normalize(JSON.parse(e.newValue)); render(); } catch (x) { } } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (S.ui.tab === 'home' && !$('#modal').innerHTML && !listening) render(); } });

/* ============================ PWA: ICONOS + MANIFEST + SERVICE WORKER ============================ */
const SW_CODE = `const C='foco-v4';
self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.addAll(['./','./index.html']).catch(()=>{})));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(fetch(e.request).then(r=>{const cp=r.clone();caches.open(C).then(c=>c.put(e.request,cp)).catch(()=>{});return r;})
    .catch(()=>caches.match(e.request).then(m=>m||caches.match('./index.html'))));
});`;

function iconPNG(size, flat, cb) {
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
      if (flat) { x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, size, size); }
      x.drawImage(img, 0, 0, size, size); cb(c.toDataURL('image/png'));
    } catch (e) { cb(null); }
  };
  img.onerror = () => cb(null);
  img.src = ICON_URI;
}
function setupPWA() {
  iconPNG(180, true, u => { if (u) $('#apple-icon').href = u; });
  iconPNG(192, false, a => iconPNG(512, false, b => {
    const icons = (a && b)
      ? [{ src: a, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: b, sizes: '512x512', type: 'image/png', purpose: 'any' }]
      : [{ src: ICON_URI, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }];
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = {
      name: 'Foco · Hábitos y productividad', short_name: 'Foco', description: 'Agenda, estudio y pomodoro en una sola app.',
      start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'portrait',
      background_color: '#000000', theme_color: '#000000', lang: 'es', icons
    };
    $('#manifest-link').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  }));
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) { swStatus = 'no disponible (abre la app por HTTPS/localhost)'; return; }
  navigator.serviceWorker.register(new URL('sw.js', location.href).href)
    .then(() => { swStatus = 'activo (modo offline habilitado)'; const s = $('#swStatus'); if (s) s.textContent = swStatus; })
    .catch(() => { swStatus = 'falta sw.js junto a index.html'; const s = $('#swStatus'); if (s) s.textContent = swStatus; });
}

/* ============================ ARRANQUE ============================ */
setupPWA();
if (!(S.pomo.running && S.pomo.endAt) && (S.pomo.remaining <= 0 || S.pomo.remaining > 3600)) S.pomo.remaining = S.settings[S.pomo.phase] * 60;
save();
render();
tick();
setInterval(tick, 250);
</script>

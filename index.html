<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root,[data-theme=dark]{
    color-scheme:dark;
    --bg:#000000; --card:#0c0c0c; --card2:#171717; --line:#2a2a2a;
    --text:#ffffff; --muted:#a3a3a3; --accent:#ffffff; --onaccent:#000000; --navbg:rgba(0,0,0,.92);
    --green:#22c55e; --t-blue:#7db3ff; --t-amber:#fbbf4d; --t-green:#5eea8f; --danger:#ff7b7b;
  }
  [data-theme=light]{
    color-scheme:light;
    --bg:#ffffff; --card:#ffffff; --card2:#f5f5f5; --line:#e5e5e5;
    --text:#171717; --muted:#737373; --accent:#f97316; --onaccent:#ffffff; --navbg:rgba(255,255,255,.94);
    --green:#16a34a; --t-blue:#1d4ed8; --t-amber:#b45309; --t-green:#15803d; --danger:#dc2626;
  }
  html,body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  body{min-height:100dvh}
  #top{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  #top .in{max-width:640px;margin:0 auto;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px}
  #logo svg{width:30px;height:30px;display:block;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
  #top .ttl{font-weight:700;font-size:18px;letter-spacing:-.02em}
  #app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 52px + 16px) 16px calc(130px + env(safe-area-inset-bottom))}
  .ico{display:block}.ico svg{width:100%;height:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .card2{background:var(--card2);border:1px solid var(--line);border-radius:12px}
  .muted{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--card2);border:1px solid var(--line);color:var(--text);transition:.15s;cursor:pointer;user-select:none}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
  .btn-danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:var(--danger)}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);cursor:pointer;flex-shrink:0}
  .iconbtn:active{background:var(--card2)}
  input[type=text],input[type=date],input[type=time],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;font-family:inherit;appearance:none;-webkit-appearance:none;min-height:44px}

  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
  .seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--onaccent)}
  .chip{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s;user-select:none}
  .chip.c-blue.on{background:rgba(59,130,246,.16);color:var(--t-blue);border-color:rgba(59,130,246,.55)}
  .chip.c-amber.on{background:rgba(245,158,11,.16);color:var(--t-amber);border-color:rgba(245,158,11,.55)}
  .chip.c-green.on{background:rgba(34,197,94,.16);color:var(--t-green);border-color:rgba(34,197,94,.55)}
  .check{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:.15s}
  .check.on{background:var(--accent);border-color:var(--accent)}
  .check svg{opacity:0;color:var(--onaccent)}.check.on svg{opacity:1}
  .bar{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}
  .bar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
  .daycell{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;position:relative;border:1px solid transparent}
  .daycell.today{border-color:var(--muted)}
  .daycell.sel{background:var(--accent);color:var(--onaccent);font-weight:700}
  .dots{position:absolute;bottom:4px;display:flex;gap:2px}
  .dots i{width:5px;height:5px;border-radius:99px;display:block}
  nav#bottom{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
  nav#bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}

  nav#bottom button.on{color:var(--accent)}
  nav#bottom svg{width:22px;height:22px}
  .fab{position:fixed;right:max(16px,calc((100vw - 640px)/2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:19px;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(0,0,0,.35);z-index:40;cursor:pointer;transition:transform .15s}
  .fab:active{transform:scale(.93)}

  .modal{width:100%;max-width:440px;max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:env(safe-area-inset-bottom)}
  @media(min-width:640px){.modal-bg{align-items:center}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  #toast{position:fixed;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translateX(-50%) translateY(-160px);background:var(--card2);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #toast.show{transform:translateX(-50%) translateY(0)}
  .ring-bg{stroke:var(--card2)}
  .ring-fg{transition:stroke-dashoffset .3s linear}
  .done-text{text-decoration:line-through;color:var(--muted)}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  ::-webkit-scrollbar{display:none}
  /* timeline estilo Google Calendar */
  .tl{overflow-y:auto;border-top:1px solid var(--line);position:relative}
  .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0;pointer-events:none}
  .hl span{position:absolute;top:-7px;left:0;width:38px;font-size:10px;color:var(--muted);text-align:right;background:var(--card);padding-right:4px}
  .layer{position:absolute;top:0;bottom:0}
  .evb{position:absolute;border-radius:6px;color:#fff;padding:2px 5px;overflow:hidden;font-size:11.5px;line-height:1.2;cursor:pointer;z-index:2;box-shadow:0 0 0 1px var(--card)}
  .evb b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evb small{display:block;font-size:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evb.done{opacity:.45}.evb.done b{text-decoration:line-through}
  .now{position:absolute;left:0;right:0;height:2px;background:#ef4444;z-index:3;pointer-events:none}
  .now:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:99px;background:#ef4444}
  .pill{display:block;border-radius:5px;color:#fff;font-size:10.5px;font-weight:600;padding:2px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .pill.done{opacity:.45;text-decoration:line-through}
  .wh{text-align:center;padding:4px 0;cursor:pointer}
  .wh .n{width:30px;height:30px;margin:2px auto 0;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
  .wh.sel .n{background:var(--accent);color:var(--onaccent)}
  .wh.today .n{box-shadow:inset 0 0 0 1.5px var(--muted)}
  .sw{width:32px;height:32px;border-radius:99px;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--card)}
  .sw.ring{border-color:var(--text)}
  /* prioridad */
  .pr{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;user-select:none}
  .pr i{width:10px;height:10px;border-radius:99px;background:var(--c);display:block}
  .pr.on{background:var(--c);border-color:var(--c);color:var(--t)}
  .pr.on i{background:var(--t)}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
  /* micrófono */
  .mic{width:46px;min-width:46px;height:46px;padding:0;flex-shrink:0}
  .mic.rec{background:#ef4444;border-color:#ef4444;color:#fff;animation:blink 1s infinite}
</style>

<script>
'use strict';
/* ============================ UTILIDADES ============================ */
const KEY = 'foco_pwa_v1';
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => fmt(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mondayOf = s => { const d = parse(s); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return fmt(d); };
const DAYS = [{ l: 'Lun', v: 1 }, { l: 'Mar', v: 2 }, { l: 'Mié', v: 3 }, { l: 'Jue', v: 4 }, { l: 'Vie', v: 5 }, { l: 'Sáb', v: 6 }, { l: 'Dom', v: 0 }];
const longDate = s => cap(parse(s).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }));
const PALETTE = ['#f97316', '#3b82f6', '#22c55e', '#a855f7', '#ef4444', '#eab308', '#14b8a6', '#ec4899'];
const PRIO = { high: { l: 'Alta', c: '#ef4444', t: '#ffffff' }, mid: { l: 'Media', c: '#f59e0b', t: '#111111' }, low: { l: 'Baja', c: '#22c55e', t: '#ffffff' } };
const PRANK = { high: 0, mid: 1, low: 2 };
const H = 48; // px por hora en el calendario
const hhmm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const REP_LABEL = { none: '', daily: 'Diaria', weekly: 'Semanal' };

/* ============================ LOGO / ICONO (SVG) ============================ */
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#FFFFFF"/><circle cx="32" cy="35" r="18" fill="none" stroke="#FF6B00" stroke-width="5"/><path d="M32 24v11l7 5" fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 8h12" fill="none" stroke="#FF6B00" stroke-width="5" stroke-linecap="round"/></svg>`;
const ICON_URI = 'data:image/svg+xml,' + encodeURIComponent(LOGO_SVG);
$('#logo').innerHTML = LOGO_SVG;

/* ============================ ESTADO ============================ */
const defaults = () => ({
  events: [], notes: {}, subjects: [],
  settings: { work: 25, rest: 5, theme: 'dark' },
  pomo: { phase: 'work', remaining: 25 * 60, running: false, endAt: null, sessions: 0 },
  ui: { tab: 'home', sub: 'list', mode: 'day', open: [] }
});
function normalize(o) {
  o = o || {};
  const s = Object.assign(defaults(), o);
  s.settings = Object.assign(defaults().settings, o.settings);
  if (!['dark', 'light'].includes(s.settings.theme)) s.settings.theme = 'dark';
  s.pomo = Object.assign(defaults().pomo, o.pomo);
  s.ui = Object.assign(defaults().ui, o.ui);
  if (!Array.isArray(s.ui.open)) s.ui.open = [];
  if (!['day', 'week', 'month'].includes(s.ui.mode)) s.ui.mode = 'day';
  if (!['home', 'study', 'settings'].includes(s.ui.tab)) s.ui.tab = 'home';
  if (!['list', 'pomo'].includes(s.ui.sub)) s.ui.sub = 'list';
  if (!Array.isArray(s.subjects)) s.subjects = [];
  // migración: tareas antiguas por fecha → eventos
  let ev = Array.isArray(o.events) ? o.events : [];
  if (!Array.isArray(o.events) && o.tasks && typeof o.tasks === 'object') {
    Object.keys(o.tasks).forEach(ds => (o.tasks[ds] || []).forEach(t => ev.push({ id: t.id, text: t.text, date: ds, doneOn: t.done ? { [ds]: true } : {} })));
  }
  delete s.tasks;
  s.events = ev.filter(e => e && e.text && e.date).map(e => ({
    id: e.id || uid(), text: String(e.text), date: e.date,
    time: /^\d\d:\d\d$/.test(e.time || '') ? e.time : '',
    dur: Number(e.dur) || 60, color: e.color || PALETTE[0],
    prio: PRIO[e.prio] ? e.prio : 'mid',
    repeat: ['daily', 'weekly'].includes(e.repeat) ? e.repeat : 'none',
    skip: Array.isArray(e.skip) ? e.skip : [],
    doneOn: e.doneOn && typeof e.doneOn === 'object' ? e.doneOn : {}
  }));
  const notes = {};
  if (o.notes && typeof o.notes === 'object') Object.keys(o.notes).forEach(ds => {
    const v = o.notes[ds];
    if (typeof v === 'string') { if (v.trim()) notes[ds] = [{ id: uid(), text: v }]; }
    else if (Array.isArray(v)) { const a = v.filter(n => n && n.text).map(n => ({ id: n.id || uid(), text: String(n.text) })); if (a.length) notes[ds] = a; }
  });
  s.notes = notes;
  return s;
}
function load() {
  try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : defaults(); }
  catch (e) { return defaults(); }
}
let S = load();
let sel = todayStr();
let calScroll = null;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar (almacenamiento lleno)'); } };
function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme;
  const m = $('#theme-meta'); if (m) m.content = S.settings.theme === 'light' ? '#ffffff' : '#000000';
}

/* ============================ EVENTOS (modelo) ============================ */
function occurs(e, ds) {
  if (ds < e.date || (e.skip || []).includes(ds)) return false;
  if (e.repeat === 'daily') return true;
  if (e.repeat === 'weekly') return parse(ds).getDay() === parse(e.date).getDay();
  return ds === e.date;
}
const evOn = ds => S.events.filter(e => occurs(e, ds)).sort((a, b) => {
  if (!!a.time !== !!b.time) return a.time ? -1 : 1;
  if (a.time) return a.time.localeCompare(b.time) || a.text.localeCompare(b.text);
  return PRANK[a.prio] - PRANK[b.prio] || a.text.localeCompare(b.text);
});
const isDone = (e, ds) => !!(e.doneOn && e.doneOn[ds]);
const startMin = e => { const [h, m] = e.time.split(':').map(Number); return h * 60 + m; };
function layout(list) {
  const items = list.map(e => ({ e, s: startMin(e), en: Math.min(1440, startMin(e) + (e.dur || 60)) })).sort((a, b) => a.s - b.s || b.en - a.en);
  let cl = [], end = 0;
  const flush = () => { const n = Math.max(...cl.map(i => i.col)) + 1; cl.forEach(i => i.n = n); cl = []; end = 0; };
  items.forEach(it => {
    if (cl.length && it.s >= end) flush();
    let c = 0; while (cl.some(o => o.col === c && o.en > it.s)) c++;
    it.col = c; cl.push(it); end = Math.max(end, it.en);
  });
  if (cl.length) flush();
  return items;
}

/* ============================ ICONOS ============================ */
const ic = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>',
  study: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M9 8h7"/></svg>',
